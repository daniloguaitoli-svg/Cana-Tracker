# WORKFLOW TEMPORÁRIO DE SONDAGEM.
#
# O cepea.org.br responde 403 (desafio da Cloudflare) quando chamado a partir das
# funções da Vercel, em qualquer região. Antes de montar uma coleta agendada aqui
# no GitHub Actions, esta sonda responde a única pergunta que importa: o IP do
# runner do GitHub consegue acessar o widget do CEPEA?
#
# Ela grava o resultado em probe-cepea.json e commita de volta no repositório.
# REMOVER (junto com o probe-cepea.json) depois da resposta.

name: Sonda CEPEA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sondar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Testar acesso ao CEPEA a partir do runner
        run: |
          cat > /tmp/sonda.mjs <<'JS'
          const UA = {
            "User-Agent":
              "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36",
            "Accept-Language": "pt-BR,pt;q=0.9",
          };
          // A primeira sonda deu resultado MISTO (um widget 403, outro 200), o que
          // aponta para um desafio probabilistico. Aqui medimos a taxa de acerto:
          // varias tentativas no mesmo endereco, espacadas, com e sem pausa.
          const url = (fonte, id) =>
            `https://www.cepea.org.br/br/widgetproduto.js.php?fonte=${fonte}&id_indicador%5B%5D=${id}`;
          const alvos = [
            ["etanol-hidratado-sp", url("etanol", 103)],
            ["acucar-sp", url("acucar", 53)],
            ["etanol-hidratado-go", url("etanol", 119)],
          ];
          const espera = (ms) => new Promise((r) => setTimeout(r, ms));
          const testes = [];
          for (const [nome, u] of alvos) {
            const tentativas = [];
            for (let i = 0; i < 5; i++) {
              const t0 = Date.now();
              try {
                const r = await fetch(u, { headers: UA, redirect: "follow" });
                const corpo = await r.text();
                // Sucesso de verdade = veio o document.write do widget, nao o desafio.
                const ehWidget = corpo.includes("imagenet-widget-tabela");
                tentativas.push({ n: i + 1, status: r.status, ms: Date.now() - t0, widget: ehWidget });
              } catch (e) {
                tentativas.push({ n: i + 1, erro: `${e.name}: ${e.message}`, ms: Date.now() - t0 });
              }
              await espera(1500);
            }
            const acertos = tentativas.filter((t) => t.widget).length;
            testes.push({ nome, acertos: `${acertos}/5`, tentativas });
          }
          console.log(JSON.stringify({ ambiente: "github-actions", agora: new Date().toISOString(), testes }, null, 1));
          JS
          node /tmp/sonda.mjs > probe-cepea.json
          cat probe-cepea.json

      - name: Commitar o resultado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe-cepea.json
          git diff --staged --quiet || git commit -m "Sonda: acesso ao CEPEA a partir do runner do GitHub"
          git push
